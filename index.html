<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Links de Produtos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
}

.container{
    position:relative;
    width:100%;
    max-width:1024px;
    line-height:0;
}

.container img{
    width:100%;
    height:auto;
    display:block;
}

.link{
    position:absolute;
    display:block;
    border-radius:999px;
    cursor:pointer;
    background:rgba(255,255,255,0);
    -webkit-tap-highlight-color:transparent;
}

/* FACA SANTOKU */
.santoku{
    left:33.5%;
    top:4.4%;
    width:31%;
    height:4.4%;
}

/* FACA CHEF */
.chef{
    left:39.2%;
    top:25.6%;
    width:22.5%;
    height:4%;
}

/* FACA YANAGIBA */
.yanagiba{
    left:37%;
    top:45.7%;
    width:27%;
    height:4%;
}

/* PINÇA */
.pinca{
    left:35%;
    top:68.9%;
    width:31%;
    height:4%;
}

/* PEDRA */
.pedra{
    left:35%;
    top:78.2%;
    width:31%;
    height:4%;
}

/* MINI RALADOR */
.ralador{
    left:33.2%;
    top:91.2%;
    width:35%;
    height:4.2%;
}

</style>

</head>

<body>

<div class="container">

<img src="imagem.png" alt="Produtos">

<a class="link santoku"
href="https://s.click.aliexpress.com/e/_c3BSjhFD"
target="_blank"></a>

<a class="link chef"
href="https://s.click.aliexpress.com/e/_c2wEbNCT"
target="_blank"></a>

<a class="link yanagiba"
href="https://s.click.aliexpress.com/e/_c3ZeCnDH"
target="_blank"></a>

<a class="link pinca"
href="https://s.click.aliexpress.com/e/_c3vN5rCx"
target="_blank"></a>

<a class="link pedra"
href="https://s.click.aliexpress.com/e/_c3jQIrwX"
target="_blank"></a>

<a class="link ralador"
href="https://s.click.aliexpress.com/e/_c3yi7VPh"
target="_blank"></a>

</div>

</body>
</html>
