<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Links de Produtos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
}

.container{
    position:relative;
    width:100%;
    max-width:1086px;
    line-height:0;
}

.container img{
    width:100%;
    height:auto;
    display:block;
}

.link{
    position:absolute;
    display:block;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

</style>

</head>

<body>

<div class="container">

<img id="imagem" src="imagem.png" alt="Produtos">

<a class="link santoku"
href="https://s.click.aliexpress.com/e/_c3BSjhFD"
target="_blank"></a>

<a class="link chef"
href="https://s.click.aliexpress.com/e/_c2wEbNCT"
target="_blank"></a>

<a class="link yanagiba"
href="https://s.click.aliexpress.com/e/_c3ZeCnDH"
target="_blank"></a>

<a class="link pinca"
href="https://s.click.aliexpress.com/e/_c3vN5rCx"
target="_blank"></a>

<a class="link pedra"
href="https://s.click.aliexpress.com/e/_c3jQIrwX"
target="_blank"></a>

<a class="link ralador"
href="https://s.click.aliexpress.com/e/_c3yi7VPh"
target="_blank"></a>

</div>

<script>

const ORIGINAL_WIDTH = 1086;
const ORIGINAL_HEIGHT = 1536;

const areas = [

{
    class:"santoku",
    left:332,
    top:103,
    width:366,
    height:74
},

{
    class:"chef",
    left:409,
    top:373,
    width:255,
    height:72
},

{
    class:"yanagiba",
    left:386,
    top:642,
    width:301,
    height:74
},

{
    class:"pinca",
    left:347,
    top:972,
    width:390,
    height:78
},

{
    class:"pedra",
    left:340,
    top:1094,
    width:402,
    height:78
},

{
    class:"ralador",
    left:330,
    top:1326,
    width:417,
    height:82
}

];

function posicionarLinks(){

    const container=document.querySelector(".container");
    const largura=container.offsetWidth;
    const escala=largura/ORIGINAL_WIDTH;

    areas.forEach(area=>{

        const el=document.querySelector("."+area.class);

        el.style.left=(area.left*escala)+"px";
        el.style.top=(area.top*escala)+"px";
        el.style.width=(area.width*escala)+"px";
        el.style.height=(area.height*escala)+"px";

    });

}

window.addEventListener("load",posicionarLinks);
window.addEventListener("resize",posicionarLinks);

</script>

</body>
</html>
